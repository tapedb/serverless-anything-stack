# GitHub Actions for an application built with serverless-anything-stack.
# Copy to .github/workflows/ci.yml. Needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and a GitHub environment
# named "production" with the owner as a required reviewer (Gate 3).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy main to production
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration   # workerd: tapedb dev or the Workers Vitest integration

  preview:
    if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: deploy
        name: Deploy a Preview for this branch
        run: |
          npx wrangler preview --name "${GITHUB_REF_NAME//\//-}" | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { APP_URL: "${{ steps.deploy.outputs.url }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-preview, path: playwright-report }

  staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx wrangler deploy --env staging
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { APP_URL: "${{ vars.STAGING_URL }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-staging, path: playwright-report }

  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.production
    needs: test
    runs-on: ubuntu-latest
    environment: production   # the owner approves here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx wrangler deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env: { APP_URL: "${{ vars.PRODUCTION_URL }}" }
